# cheapllm.wtf y api.cheapllm.wtf en el servidor propio (ADR-0059). Se instala como
# /etc/nginx/sites-available/cheapllm.wtf con un enlace en sites-enabled (deploy/setup.sh).
# Cloudflare hace de proxy y habla con este vhost por TLS contra el certificado autofirmado de
# /etc/nginx/ssl/cheapllm.wtf, así que el modo SSL de la zona es Full, no Full (strict).

server {
    listen 80;
    server_name cheapllm.wtf api.cheapllm.wtf;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cheapllm.wtf api.cheapllm.wtf;

    ssl_certificate /etc/nginx/ssl/cheapllm.wtf/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/cheapllm.wtf/privkey.pem;

    # Los requests con imágenes en base64 pesan varios MB (docs/04).
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3014;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # El gateway solo responde en el host de la API (API_HOST) y proxy.ts solo en el de la web.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streams del gateway: sin buffer, y hasta los 800 s de /v1/chat/completions (ADR-0005).
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
